name: Build and Release

on:
  push:
    branches: [main, codex/submission-audit]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            args: --bundles nsis
            artifact: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-15
            platform: macOS
            args: --target aarch64-apple-darwin --bundles dmg
            artifact: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run assets
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Browser regression tests
        if: runner.os == 'Windows'
        run: npm run test:ui
      - name: Build installer
        run: npm run tauri -- build --ci ${{ matrix.args }}
      - name: Verify macOS bundle and startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/EasyLingo.app"
          codesign --verify --deep --strict "$app"
          file "$app/Contents/MacOS/easylingo" | grep arm64
          "$app/Contents/MacOS/easylingo" > macos-startup.log 2>&1 &
          app_pid=$!
          sleep 10
          kill -0 "$app_pid"
          kill "$app_pid"
      - name: Install and verify Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe).FullName
          $installDir = Join-Path $env:RUNNER_TEMP 'EasyLingo-install-test'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', '/CURRENTUSER', "/D=$installDir") -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          node scripts/native-smoke.cjs "$installDir/easylingo.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: EasyLingo-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Checksums
        run: cd installers && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          draft: true
          generate_release_notes: true
