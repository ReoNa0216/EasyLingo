name: Build and Release

on:
  push:
    branches: [main, codex/submission-audit]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            args: --bundles nsis
            artifact: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-14
            platform: macOS
            args: --target aarch64-apple-darwin --bundles dmg
            artifact: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run assets
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Browser regression tests
        if: runner.os == 'Windows'
        run: npm run test:ui
      - name: Build installer
        run: npm run tauri -- build --ci ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: EasyLingo-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Checksums
        run: cd installers && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          draft: true
          generate_release_notes: true
