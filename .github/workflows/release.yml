name: Build and Release

on:
  push:
    branches: [main, codex/submission-audit]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            args: --bundles nsis
            artifact: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-15
            platform: macOS
            args: --target aarch64-apple-darwin --bundles dmg
            artifact: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run assets
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Browser regression tests
        if: runner.os == 'Windows'
        run: npm run test:ui
      - name: Build installer
        run: npm run tauri -- build --ci ${{ matrix.args }}
      - name: Verify macOS bundle and startup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          mount="$RUNNER_TEMP/EasyLingo-dmg"
          mkdir -p "$mount"
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mount"
          trap 'hdiutil detach "$mount"' EXIT
          app="$RUNNER_TEMP/EasyLingo.app"
          ditto "$mount/EasyLingo.app" "$app"
          codesign --verify --deep --strict "$app"
          file "$app/Contents/MacOS/easylingo" | grep arm64
          "$app/Contents/MacOS/easylingo" > macos-startup.log 2>&1 &
          app_pid=$!
          sleep 10
          kill -0 "$app_pid"
          kill "$app_pid"
      - uses: actions/upload-artifact@v4
        with:
          name: EasyLingo-${{ matrix.platform }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 30 || 7 }}
  verify-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: EasyLingo-Windows
          path: installers
      - name: Install and verify Windows package
        shell: pwsh
        run: |
          $installer = (Get-ChildItem installers/*.exe).FullName
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', '/CURRENTUSER', '/NS') -WindowStyle Hidden -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $registration = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\EasyLingo' -ErrorAction Stop
          $expectedVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($registration.DisplayVersion -ne $expectedVersion) { throw 'Unexpected installed version' }
          $installDir = $registration.InstallLocation.Trim('"')
          if (!(Test-Path -LiteralPath "$installDir/easylingo.exe")) { throw "Installed executable missing: $installDir" }
          Write-Output "Verifying installed version $($registration.DisplayVersion) at $installDir"
          node scripts/native-smoke.cjs "$installDir/easylingo.exe" 2>&1 | Tee-Object native-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-validation
          path: |
            native-smoke.log
            artifacts/native-about.png
          retention-days: 7
  release:
    needs: [build, verify-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: EasyLingo-*
          path: installers
          merge-multiple: true
      - name: Checksums
        run: cd installers && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          draft: true
          generate_release_notes: true
