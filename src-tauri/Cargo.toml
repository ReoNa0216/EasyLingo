[package]
name = "easylingo"
version = "2.0.1"
description = "A desktop language learning app powered by AI and SRS"
authors = ["陈挚"]
license = "MIT"
edition = "2021"
rust-version = "1.94"
build = "build.rs"

[lib]
name = "easylingo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "easylingo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-sql = { version = "2.0", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
scraper = "0.22"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
